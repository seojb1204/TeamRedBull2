name: Pixel bridge regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python3 -m unittest discover -s Experiments/PixelAgent -p 'test_*.py' -q
      - run: python3 Tests/run-pixel-bridge.py --dotnet dotnet
      - run: python3 Tests/run-playtest-agent.py --dotnet dotnet --output /tmp/logic-qa.csv
