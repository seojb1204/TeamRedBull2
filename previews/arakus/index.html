let assets={},id='Idle',group='캐릭터',frame=0,paused=false,ended=false,flip=false,accum=0,last=0;
async function decode(src){const im=new Image();im.src=src;await im.decode();return im}
function setPaused(p){paused=p;document.getElementById('play').textContent=p?'재생':'일시정지'}
function menu(){const host=document.getElementById('clips');host.innerHTML='';for(const d of definitions.filter(d=>d.group===group)){const b=document.createElement('button');b.textContent=d.label;b.dataset.clip=d.id;b.onclick=()=>choose(d.id,true);host.append(b)}document.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b.dataset.group===group))}
function film(){const host=document.getElementById('film');host.innerHTML='';clips[id].images.forEach((src,i)=>{const b=document.createElement('button');b.dataset.frame=i;const img=document.createElement('img');img.src=src;img.alt=(i+1)+'프레임';b.append(img);b.onclick=()=>{setPaused(true);ended=false;frame=i;draw()};host.append(b)})}
function choose(next,play){id=next;frame=0;ended=false;accum=0;document.getElementById('scrub').max=clips[id].count-1;if(play)setPaused(false);film();resize();draw()}
function draw(){if(!assets[id])return;const d=clips[id],c=document.getElementById('canvas'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,d.size,d.size);ctx.save();if(flip){ctx.translate(d.size,0);ctx.scale(-1,1)}ctx.drawImage(assets[id][frame],0,0);ctx.restore();document.getElementById('name').textContent=d.label;document.getElementById('details').textContent=d.count+'프레임'+' · '+(d.ms.reduce((a,b)=>a+b,0)/1000).toFixed(2)+'초 · '+d.size+'×'+d.size+'px';document.getElementById('status').textContent=(frame+1)+' / '+d.count+' · 방패 '+d.shield[frame];document.getElementById('description').textContent=d.description;document.getElementById('scrub').value=frame;document.querySelectorAll('[data-clip]').forEach(b=>b.classList.toggle('active',b.dataset.clip===id));document.querySelectorAll('[data-frame]').forEach(b=>b.classList.toggle('active',Number(b.dataset.frame)===frame))}
for(const name of ['캐릭터','소품','이펙트']){const b=document.createElement('button');b.textContent=name;b.dataset.group=name;b.onclick=()=>{group=name;menu();choose(definitions.find(d=>d.group===group).id,true)};document.getElementById('groups').append(b)}menu();
document.getElementById('play').onclick=()=>{if(ended)choose(id,true);else setPaused(!paused)};
document.getElementById('step').onclick=()=>{setPaused(true);ended=false;frame=(frame+1)%clips[id].count;draw()};document.getElementById('replay').onclick=()=>choose(id,true);document.getElementById('flip').onclick=()=>{flip=!flip;draw()};document.getElementById('scrub').oninput=e=>{setPaused(true);frame=Number(e.target.value);accum=0;draw()};
function resize(){const c=document.getElementById('canvas'),s=clips[id].size,z=Number(document.getElementById('zoom').value);c.width=s;c.height=s;c.style.width=s*z+'px';c.style.height=s*z+'px';draw()}document.getElementById('zoom').onchange=resize;
function tick(now){if(!last)last=now;if(!paused&&!ended){accum+=Math.min(now-last,200)*Number(document.getElementById('speed').value);while(!paused&&accum>=clips[id].ms[frame]){accum-=clips[id].ms[frame];if(frame+1<clips[id].count)frame++;else if(clips[id].loop)frame=0;else{ended=true;setPaused(true);accum=0}draw()}}last=now;requestAnimationFrame(tick)}
(async()=>{for(const d of definitions)assets[d.id]=await Promise.all(d.images.map(decode));choose('Idle',true);requestAnimationFrame(tick)})().catch(e=>document.getElementById('error').textContent='이미지 불러오기 실패: '+e.message);
</script></html>
