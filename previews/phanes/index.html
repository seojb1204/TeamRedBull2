<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phanes V1 크기와 동작</title><style>body{background:#15151e;color:#eee9ff;font:16px system-ui;margin:0}main{max-width:1200px;margin:20px auto;padding:16px}h1{font-size:28px}p{line-height:1.6;color:#c1bace}canvas{width:100%;display:block;background:#292934;image-rendering:pixelated;border:1px solid #665273}button,select{font:inherit;padding:9px;background:#3d304b;color:white;border:1px solid #806b90;border-radius:4px;margin:6px 4px}small{color:#b4a9c2;line-height:1.7;display:block}</style><main><h1>PHANES V1 · 아라쿠스 크기 비교</h1><p>몸 높이 약 2.2 Unity 단위 기준. 부유 높이와 지팡이는 몸 높이와 별도입니다.</p><select id="mode"></select><button id="pause">일시정지</button><button id="flip">좌우 반전</button><button id="compare">아라쿠스 숨기기</button><span id="status">불러오는 중</span><canvas width="1200" height="680"></canvas><p>아트 동작 미리보기입니다. 공격 판정·이동·피해량은 구현하지 않았고, 마법은 미리보기용 코드 연출입니다.</p><small>최신 main f13bb6bd 기준 아라쿠스: 88px / 56 PPU × 1.4 = 2.2 단위.<br>공유 자세를 사용하는 공격은 선택 목록에 ‘공유’로 표시합니다. 생성 도트의 픽셀·팔레트·프레임 정제 및 Unity 연결 전입니다.</small></main><script>
const defs=[['idle','대기','idle-cast',0,4,512,395,470],['teleport','순간이동','basic',0,4,384,300,335],['hurt','피격','basic',4,4,384,300,335],['groggy','그로기','basic',8,4,384,300,335],['death','사망','basic',12,4,384,300,335],['orb','유도 광탄','idle-cast',4,4,512,395,470],['fan','부채꼴 산탄','spells-a',0,4,384,300,335],['reflect','굴절의 광탄','spells-a',4,4,384,300,335],['pillar','단죄의 빛 기둥','spells-a',8,4,384,300,335],['laser','신벌의 징벌선','spells-a',12,4,384,300,335],['chant','천벌의 잔향','spells-b',0,4,384,300,335],['fire','영벌의 업화','spells-b',4,4,384,300,335],['barrier','단절의 결계','spells-b',8,4,384,300,335],['nebula','성운의 파편 (결계 자세 공유)','spells-b',8,4,384,300,335],['gravity','인력의 왜곡','spells-b',12,3,384,300,335],['ghost','환영 분신 (왜곡 자세 공유)','spells-b',14,2,384,300,335]];
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),select=document.querySelector('#mode'),status=document.querySelector('#status');let mode=0,time=0,last=0,running=true,face=1,compare=true;const images={};for(const id of ['idle-cast','basic','spells-a','spells-b','arakus-idle']){images[id]=new Image();images[id].src='assets/'+id+'.png';}
select.innerHTML='<option value="auto">전체 자동 재생</option>'+defs.map((d,i)=>`<option value="${i}">${d[1]}</option>`).join('');select.onchange=()=>time=0;document.querySelector('#pause').onclick=e=>{running=!running;e.target.textContent=running?'일시정지':'재생';};document.querySelector('#flip').onclick=()=>face=-face;document.querySelector('#compare').onclick=e=>{compare=!compare;e.target.textContent=compare?'아라쿠스 숨기기':'아라쿠스 비교';};
function body(image,frame,cols,cellH,x,feet,bodyPx,baseline,alpha=1,dir=1){if(!image.complete||!image.naturalWidth)return;let ratio=image.naturalWidth/(image===images['arakus-idle']?768:1536);cellH*=ratio;bodyPx*=ratio;baseline*=ratio;let cellW=image.naturalWidth/cols,scale=242/bodyPx;ctx.save();ctx.translate(x,feet);ctx.scale(dir,1);ctx.globalAlpha=alpha;ctx.drawImage(image,(frame%cols)*cellW,Math.floor(frame/cols)*cellH,cellW,cellH,-cellW*scale/2,-baseline*scale,cellW*scale,cellH*scale);ctx.restore();}
function pixel(x,y,size,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),size,size);}
function ring(x,y,r,color){ctx.strokeStyle=color;ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();}
function effects(id,t,x){let a=t%2.2,active=a>.9,dir=face;const front=x+dir*85;if(!active)return;let u=a-.9;ctx.globalAlpha=Math.max(0,1-u/1.4);
if(id==='orb'||id==='fan'||id==='reflect'){let n=id==='fan'?5:1;for(let j=0;j<n;j++){let ox=front+dir*u*300,oy=365+(j-(n-1)/2)*u*90;let color=id==='reflect'?'#a9e9ff':'#ffe597';pixel(ox,oy,id==='reflect'?32:16,color);pixel(ox-dir*25,oy+4,10,'#c3a456');}}
if(id==='pillar'||id==='laser'){ctx.fillStyle='#ffe3a4';id==='pillar'?ctx.fillRect(front+dir*140,90,45,490):ctx.fillRect(front,555,dir>0?350:-350,25);}
if(id==='chant'||id==='fire'){for(let j=0;j<7;j++){let xx=front+dir*(j*46);pixel(xx,560-(Math.sin(u*8+j)+1)*14,22,id==='fire'?'#ffe08c':'#e69baf');}}
if(id==='barrier'){ctx.fillStyle='#e8d28a';for(let j=0;j<12;j++)ctx.fillRect(front+dir*150,550-j*38,22,28);}
if(id==='nebula'){ring(front,280,55,'#c3a1e0');for(let j=0;j<8;j++){let r=u*160;pixel(front+Math.cos(j*Math.PI/4)*r,280+Math.sin(j*Math.PI/4)*r,10,'#ffe7ab');}}
if(id==='gravity'){for(let j=0;j<14;j++){let r=90*(1-u/1.5);pixel(front+Math.cos(j+u*5)*r,330+Math.sin(j+u*5)*r,6,'#b8a0ec');}ring(front,330,20,'#7860ac');}
ctx.globalAlpha=1;}
function render(t){ctx.imageSmoothingEnabled=false;ctx.fillStyle='#292934';ctx.fillRect(0,0,1200,680);ctx.fillStyle='#33333e';for(let x=0;x<1200;x+=40)for(let y=0;y<680;y+=40)if((x+y)%80===0)ctx.fillRect(x,y,40,40);ctx.fillStyle='#777080';ctx.fillRect(0,580,1200,2);let index=select.value==='auto'?Math.floor(t/3)%defs.length:Number(select.value),d=defs[index],local=select.value==='auto'?t%3:t;let frame=d[2]==='idle-cast'&&d[0]==='idle'?Math.floor(local/.25)%4:Math.min(d[4]-1,Math.floor((local%2.2)/2.2*d[4]));let alpha=d[0]==='teleport'?(frame===2?.15:frame===1?.6:1):1;let x=compare?760:600;
if(compare)body(images['arakus-idle'],Math.floor(t/.3)%4,4,192,290,580,88,160,1,1);
body(images[d[2]],d[3]+frame,4,d[5],x,((d[0]==='groggy'&&frame>=1)||(d[0]==='death'&&frame===3)?580:540)+(d[0]==='idle'?Math.sin(t*2)*4:0),d[6],d[7],alpha,face);effects(d[0],local,x);
if(d[0]==='ghost')for(const xx of [x-140,x+140])body(images['idle-cast'],0,4,512,xx,540,395,470,.3,face);
ctx.fillStyle='#eee4fa';ctx.font='20px sans-serif';if(compare)ctx.fillText('아라쿠스 · 기준 몸 높이 2.2',120,630);ctx.fillText('파네스 · 목표 몸 높이 2.2',x-155,630);status.textContent=d[1];window.previewState={id:d[0],frame,comparison:compare,targetWorldHeight:2.2};}
function loop(ms){if(last&&running)time+=Math.min(.1,(ms-last)/1000);last=ms;render(time);requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
